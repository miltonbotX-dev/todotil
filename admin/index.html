<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · Todotil</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D4ED8">
<link rel="icon" type="image/png" href="../img/favicon-32.png">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="admin.css">
<script src="../js/config.js" defer></script>
<script src="../js/vendor/supabase.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="./"><img src="../img/icon.svg" alt=""><span>Todo<b>til</b></span> <small style="color:var(--muted);font-size:13px;font-weight:700">Panel</small></a>
  <nav><button class="icon-btn" id="notifBtn" hidden title="Activar avisos">🔔</button><button class="icon-btn" id="outBtn" hidden>Salir</button></nav></div></header>
<main class="wrap" style="padding:14px 16px 60px">
  <section id="login" hidden><form id="lf" class="panel" style="max-width:420px;margin:30px auto">
    <h1 style="margin:0 0 6px;font-size:22px">Ingresar al panel</h1>
    <label for="le">Correo</label><input id="le" type="email" autocomplete="username" required>
    <label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required>
    <div id="lerr" class="err" hidden></div>
    <div style="margin-top:14px"><button class="btn btn-blue" id="lbtn">Ingresar</button></div>
    <p style="text-align:center;margin:12px 0 0"><a href="#" id="forgot">Olvidé mi contraseña</a></p>
  </form></section>
  <section id="setpw" hidden><form id="pf" class="panel" style="max-width:420px;margin:30px auto">
    <h1 style="margin:0 0 6px;font-size:22px">Crea tu contraseña</h1>
    <p style="margin:0;color:var(--muted)">Cuenta: <b id="pwEmail"></b></p>
    <input type="email" autocomplete="username" hidden>
    <label for="pw1">Nueva contraseña <small>(mínimo 8)</small></label><input id="pw1" type="password" autocomplete="new-password" required minlength="8">
    <label for="pw2">Repite la contraseña</label><input id="pw2" type="password" autocomplete="new-password" required minlength="8">
    <div id="perr2" class="err" hidden></div>
    <div style="margin-top:14px"><button class="btn btn-main" id="pbtn">Guardar contraseña</button></div>
  </form></section>
  <section id="noadmin" hidden class="panel" style="max-width:520px;margin:30px auto"></section>
  <section id="app" hidden>
    <div class="tabs"><button class="chip on" data-t="orders">Pedidos <span class="pill" id="pendCount" hidden>0</span></button><button class="chip" data-t="products">Productos</button><button class="chip" data-t="settings">Ajustes</button></div>
    <div id="t-orders"><div class="chips" id="sf" style="margin:10px 0"></div><div id="olist"></div></div>
    <div id="t-products" hidden><div style="margin:10px 0"><button class="btn btn-main" id="newP" style="min-height:44px">+ Nuevo producto</button></div><div id="plist"></div>
      <p class="hint">Imágenes: por ahora pega URLs (una por línea). Luego conectamos Cloudinary para subir fotos y videos.</p></div>
    <div id="t-settings" hidden></div>
  </section>
</main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
</body></html>
